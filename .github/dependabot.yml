version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
