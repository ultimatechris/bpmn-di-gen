name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package version
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error('Release tag must be ' + expected + ', got ' + process.env.GITHUB_REF_NAME);
          }"

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Build package
        run: npm run build

      - name: Run release test suite
        run: npm run test:ci

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
        env:
          # Used only to bootstrap the first release. Once npm trusted publishing
          # is configured, OIDC is preferred and this secret can be deleted.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
